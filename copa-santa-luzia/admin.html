<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Administrador — Copa Santa Luzia</title>
  <link rel="icon" type="image/png" href="assets/Emblema%20Copa%20Santa%20Luzia%20em%20PNG%20transparente.png">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css?v=20261119-copa-logo-restaurada">
  <!-- Leitura de planilhas .xlsx/.xls (o .csv funciona mesmo sem esta biblioteca) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- LOGIN DO ADMINISTRADOR -->
  <div id="login-screen" class="login-wrap" hidden>
    <div class="login-card">
      <div style="font-size:2.2rem">🔐</div>
      <h1>Painel do Administrador</h1>
      <p class="muted">Acesso restrito à organização do campeonato.</p>
      <form id="admin-form" autocomplete="on">
        <label>Usuário<input name="username" autocomplete="username" required autofocus></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <div class="err" id="login-err"></div>
        <button class="btn" style="width:100%">Entrar</button>
      </form>
      <a class="link-admin" href="index.html">← Voltar ao site</a>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="app" hidden>
    <header class="topbar admin-topbar">
      <div class="topbar-in">
        <div class="brand"><img class="brand-logo" src="assets/Emblema%20Copa%20Santa%20Luzia%20em%20PNG%20transparente.png" alt="Logomarca Copa Santa Luzia"><span>Admin · <span id="app-name">Copa Santa Luzia</span></span></div>
        <div class="who">
          <span class="name" id="who-name"></span>
          <a class="btn ghost sm" href="index.html" style="text-decoration:none">Ver site</a>
          <button class="btn ghost sm" id="logout-btn">Sair</button>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="dlg"></dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js?v=20261119-copa-logo-restaurada"></script>
  <script src="js/stats.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shared.js?v=20261123-roster-auto-number"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/admin.js?v=20261123-a4-single-page"></script>
</body>
</html>
